name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  draft:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      # Fails when CHANGELOG.md has no section for this version
      - name: Read the release notes
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '/^## / { found = ($2 == version); next } found' CHANGELOG.md \
            | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

  build:
    needs: draft
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: darwin/universal }
          - { name: Windows, os: ubuntu-latest, platform: windows/amd64 }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, which makes the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build
        run: go tool mygo build -platform "${{ matrix.platform }}"
      # Names without the version keep the releases/latest/download links in the README working
      - name: Name the files
        working-directory: build
        run: |
          out="$RUNNER_TEMP/upload"
          mkdir "$out"
          case "${{ matrix.name }}" in
            macOS)
              cp darwin-universal/*.dmg "$out/AgentDiff.dmg" ;;
            Windows)
              cp windows-amd64/*-setup-*.exe "$out/AgentDiff-Setup-amd64.exe" ;;
            Linux)
              for arch in amd64 arm64; do
                cp linux-$arch/*.tar.gz "$out/agentdiff-linux-$arch.tar.gz"
                cp linux-$arch/*.deb "$out/agentdiff_$arch.deb"
              done
              cp linux-amd64/install.sh "$out/install.sh" ;;
          esac
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/upload/* --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
